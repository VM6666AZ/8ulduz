name: Audit emulator
on: push
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [30, 36]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - name: Build minified release APK with a throwaway key
        run: |
          keytool -genkeypair -storetype pkcs12 -keystore "$RUNNER_TEMP/t.p12" -storepass audit-only -alias upload -keyalg RSA -keysize 2048 -validity 2 -dname "CN=audit"
          cd android && chmod +x gradlew
          ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/t.p12" ANDROID_KEYSTORE_PASSWORD=audit-only ./gradlew --no-daemon assembleRelease -PversionCode=1
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash tools/test.sh api${{ matrix.api }}
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: audit-api${{ matrix.api }}
          path: artifacts/
          if-no-files-found: warn
